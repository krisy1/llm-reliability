# Experiment design. Every number here is read by the scripts; change it here, not in code.

task: mmlu_pro

sampling:
  n_items: 50                # pilot = 50, full study = 300
  random_state: 2026         # seed for item sampling and option reshuffles
  stratify_by: category      # spread evenly over MMLU-Pro's 14 subjects

factors:
  seeds: [0, 1]              # pilot = [0, 1]; full = [0, 1, 2, 3]
  wordings: [w0, w1]         # pilot = [w0, w1]; full = [w0, w1, w2]  (w0 = original)
  orders: [o0, o1]           # o0 = original order, o1 = one fixed reshuffle per item
  greedy_cells: true         # also run every wording x order cell once at temperature 0

prompt:
  # Text placed at the start of the assistant turn, identical for every model. Decide it in the
  # pilot and FREEZE it before the main runs (pre-register). "" = no prefill.
  assistant_prefill: ""

decoding:
  sampled:
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 8
  greedy:
    temperature: 0.0
    max_new_tokens: 8

analysis:
  n_bootstrap: 2000          # resamples over ITEMS (never over runs)
  ci_level: 0.95
